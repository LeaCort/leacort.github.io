<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeaCort</title>
<meta name="description" content="LeaCort, independent game publisher.">
<style>
  :root { --violet: #5B2ED6; --encre: #2B0E48; --papier: #FFF6E5; --or: #FFC93C; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--violet); color: var(--papier);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.5; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 2.2rem; margin: 0 0 4px; }
  .sous { margin: 0 0 32px; opacity: .9; }
  .carte { display: block; background: var(--papier); color: var(--encre); text-decoration: none;
           border: 3px solid var(--encre); border-radius: 16px; padding: 20px;
           box-shadow: 4px 4px 0 var(--encre); margin-bottom: 16px; }
  .carte h2 { margin: 0 0 4px; font-size: 1.4rem; }
  .carte p { margin: 0; }
  footer { margin-top: 40px; font-size: .9rem; opacity: .9; }
  a { color: var(--or); }
</style>
</head>
<body>
<main>
  <h1>LeaCort</h1>
  <p class="sous">Independent games, made in Switzerland.</p>

  <a class="carte" href="secret-rules/">
    <h2>Secret Rules</h2>
    <p>A party game of hidden rules. One phone, 3 to 20 players, nothing to set up.</p>
  </a>

  <footer>
    Contact: <a href="mailto:secretrulesgame@gmail.com">secretrulesgame@gmail.com</a><br>
    &copy; 2026 Léa Cortembert
  </footer>
</main>
</body>
</html>
